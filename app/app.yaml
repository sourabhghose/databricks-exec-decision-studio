command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

resources:
  - name: warehouse
    sql_warehouse:
      id: 33baaa9523773520
      permission: CAN_USE
  - name: llm_endpoint
    serving_endpoint:
      name: databricks-claude-sonnet-4-6
      permission: CAN_QUERY

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  - name: SUPERVISOR_ENDPOINT
    value: eds-supervisor
